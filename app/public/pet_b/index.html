<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小寻（方向 B）动态预览</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f7fb; font-family: system-ui, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    canvas { height: min(82vh, 1360px); aspect-ratio: 848 / 1360; background: transparent; }
    .hint { color: #5b6b7d; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="pet" width="848" height="1360"></canvas>
    <div class="hint">鼠标移动：视线跟随 · 自动眨眼 · 呼吸与头发、鲸尾轻微摆动（无口型）</div>
  </div>
  <script>
    const L = {};
    const names = ['base_body_head', 'hair_back_medium', 'iris_L', 'iris_R', 'hair_front_medium', 'whale_hairpin', 'lid_L', 'lid_R'];
    let loaded = 0;
    names.forEach((n) => {
      const img = new Image();
      img.onload = () => { loaded += 1; if (loaded === names.length) start(); };
      img.src = `/pet_b/layers/${n}.png`;
      L[n] = img;
    });

    const canvas = document.getElementById('pet');
    const ctx = canvas.getContext('2d');
    // 眼睛中心（画布坐标，与 norm 图层一致）
    const EYE_L = { x: 385, y: 318 };
    const EYE_R = { x: 458, y: 318 };
    // 头发摆动支点（头顶附近）
    const PIVOT = { x: 424, y: 150 };
    const gaze = { x: 0, y: 0, tx: 0, ty: 0 };

    window.addEventListener('pointermove', (e) => {
      const r = canvas.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width - 0.5;
      const ny = (e.clientY - r.top) / r.height - 0.5;
      // 视线限幅：只在眼白内移动
      gaze.tx = Math.max(-1, Math.min(1, nx * 3)) * 4;
      gaze.ty = Math.max(-1, Math.min(1, ny * 3)) * 2.5;
    });

    function drawWithTransform(img, opts) {
      ctx.save();
      if (opts.pivot) {
        ctx.translate(opts.pivot.x, opts.pivot.y);
        ctx.rotate(opts.rot || 0);
        ctx.translate(-opts.pivot.x, -opts.pivot.y);
      }
      ctx.translate(opts.dx || 0, opts.dy || 0);
      ctx.drawImage(img, 0, 0, 848, 1360);
      ctx.restore();
    }


    // 眨眼：按 Live2D CubismWebFramework CubismEyeBlink 的状态机
    // 默认参数：闭合 0.1s、闭着 0.05s、睁开 0.15s、间隔随机（当前时刻起 0–7s）
    const blink = { state: 'first', next: 0, start: 0, open: 1, interval: 4.0, closing: 0.1, closed: 0.05, opening: 0.15 };
    function updateBlink(t) {
      const since = t - blink.start;
      switch (blink.state) {
        case 'first':
          blink.state = 'interval';
          blink.next = t + Math.random() * (2 * blink.interval - 1);
          blink.open = 1; break;
        case 'closing': {
          const k = Math.min(1, since / blink.closing);
          blink.open = 1 - k;
          if (k >= 1) { blink.state = 'closed'; blink.start = t; }
          break;
        }
        case 'closed':
          blink.open = 0;
          if (since / blink.closed >= 1) { blink.state = 'opening'; blink.start = t; }
          break;
        case 'opening': {
          const k = Math.min(1, since / blink.opening);
          blink.open = k;
          if (k >= 1) {
            blink.state = 'interval';
            blink.next = t + Math.random() * (2 * blink.interval - 1);
          }
          break;
        }
        case 'interval':
          blink.open = 1;
          if (t > blink.next) { blink.state = 'closing'; blink.start = t; }
          break;
      }
    }

    function start() {
      const t0 = performance.now();
      function frame(now) {
        const t = (now - t0) / 1000;
        gaze.x += (gaze.tx - gaze.x) * 0.15;
        gaze.y += (gaze.ty - gaze.y) * 0.15;
        const breath = Math.sin(t * Math.PI * 2 * 0.25) * 1.5; // 约 4 秒一次
        const sway = Math.sin(t * Math.PI * 2 * 0.4) * 0.012;  // 头发摆动（弧度）
        updateBlink(t);
        const whaleRot = Math.sin(t * Math.PI * 2 * 0.5) * 0.03;

        ctx.clearRect(0, 0, 848, 1360);
        // 身体与底板整体呼吸
        drawWithTransform(L.base_body_head, { dy: breath });
        // 后发随风摆动
        drawWithTransform(L.hair_back_medium, { pivot: PIVOT, rot: sway, dy: breath });
        // 虹膜跟随视线
        ctx.save();
        ctx.translate(gaze.x, gaze.y + breath);
        ctx.drawImage(L.iris_L, 0, 0, 848, 1360);
        ctx.drawImage(L.iris_R, 0, 0, 848, 1360);
        ctx.restore();
        // 眼皮（眨眼）：由 blink.open 驱动，闭合时从上方下落并淡入
        const c = 1 - blink.open;
        if (c > 0.001) {
          const dy = -(1 - c) * 30 + breath;
          ctx.save();
          ctx.globalAlpha = Math.min(1, c * 1.2);
          ctx.drawImage(L.lid_L, 385 - 40, 318 - 35 + dy, 80, 70);
          ctx.drawImage(L.lid_R, 458 - 40, 318 - 35 + dy, 80, 70);
          ctx.restore();
        }
        // 前发（刘海）轻微摆动
        drawWithTransform(L.hair_front_medium, { pivot: PIVOT, rot: sway * 0.6, dy: breath });
        // 鲸尾发饰轻微晃动
        drawWithTransform(L.whale_hairpin, { pivot: { x: 690, y: 330 }, rot: whaleRot, dy: breath });
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
