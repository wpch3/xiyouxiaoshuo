name: Build AI Token Pet Windows EXE Release

on:
  push:
    branches: [ "main", "arena/*" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies & Build Web Dist
        run: |
          cd app
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and PyWebView
        run: |
          pip install pyinstaller pywebview

      - name: Build Standalone Windows EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "AITokenPet" --add-data "app/dist;dist" desktop_main.py

      - name: Create Release Zip Package
        run: |
          Compress-Archive -Path dist/AITokenPet/* -DestinationPath AITokenPet-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AITokenPet-Windows-x64
          path: AITokenPet-Windows-x64.zip

      - name: Release to GitHub Releases (Optional on Tag/Push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AITokenPet-Windows-x64.zip
